services:
  lyrion-music-server:
    image: lmscommunity/lyrionmusicserver:9.1.2
    restart: unless-stopped
    ports:
      - "${KIBAN_LYRION_MUSIC_SERVER_PORT:-9000}:9000"
      - "${KIBAN_LYRION_MUSIC_SERVER_CLI_PORT:-9090}:9090"
      - "${KIBAN_LYRION_MUSIC_SERVER_DISCOVERY_PORT:-3483}:3483/tcp"
      - "${KIBAN_LYRION_MUSIC_SERVER_DISCOVERY_PORT:-3483}:3483/udp"
    environment:
      HTTP_PORT: "9000"
      KIBAN_LYRION_MUSIC_SERVER_PORT: ${KIBAN_LYRION_MUSIC_SERVER_PORT:-9000}
      KIBAN_LYRION_MUSIC_SERVER_CLI_PORT: ${KIBAN_LYRION_MUSIC_SERVER_CLI_PORT:-9090}
      KIBAN_LYRION_MUSIC_SERVER_DISCOVERY_PORT: ${KIBAN_LYRION_MUSIC_SERVER_DISCOVERY_PORT:-3483}
    volumes:
      - lyrion_config:/config
      - lyrion_music:/music
      - lyrion_playlists:/playlist
volumes:
  lyrion_config:
  lyrion_music:
  lyrion_playlists:
