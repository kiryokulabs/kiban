services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27-ls404
    restart: unless-stopped
    ports:
      - "${KIBAN_CALIBRE_WEB_PORT:-8083}:8083"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      KIBAN_CALIBRE_WEB_PORT: ${KIBAN_CALIBRE_WEB_PORT:-8083}
    volumes:
      - calibre_web_config:/config
      - calibre_web_books:/books
volumes:
  calibre_web_config:
  calibre_web_books:
