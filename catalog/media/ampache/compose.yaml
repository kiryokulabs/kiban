services:
  ampache:
    image: ampache/ampache:8.2.2
    restart: unless-stopped
    ports:
      - "${KIBAN_AMPACHE_PORT:-80}:80"
    environment:
      MYSQL_USER: admin
      MYSQL_PASS: ${KIBAN_AMPACHE_MYSQL_PASSWORD:-ampache-mysql-password}
      DB_NAME: ampache
      AMPACHE_ADMIN_USER: admin
      AMPACHE_ADMIN_PASSWORD: ${KIBAN_AMPACHE_ADMIN_PASSWORD:-ampache-admin-password}
      AMPACHE_ADMIN_EMAIL: admin@example.com
      FORCE_INSTALL: "0"
      KIBAN_AMPACHE_PORT: ${KIBAN_AMPACHE_PORT:-80}
      KIBAN_AMPACHE_MYSQL_PASSWORD: ${KIBAN_AMPACHE_MYSQL_PASSWORD:-ampache-mysql-password}
      KIBAN_AMPACHE_ADMIN_PASSWORD: ${KIBAN_AMPACHE_ADMIN_PASSWORD:-ampache-admin-password}
    volumes:
      - ampache_backup:/var/www/backup
      - ampache_config:/var/www/config
      - ampache_log:/var/log/ampache
      - ampache_media:/media
      - ampache_mysql:/var/lib/mysql
volumes:
  ampache_backup:
  ampache_config:
  ampache_log:
  ampache_media:
  ampache_mysql:
