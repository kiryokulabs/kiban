services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: 1h
      ND_SESSIONTIMEOUT: 720h
      ND_BASEURL: ""
    ports:
      - "${KIBAN_NAVIDROME_PORT:-4533}:4533"
    volumes:
      - navidrome_data:/data
      - navidrome_music:/music:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  navidrome_data:
  navidrome_music:
