services:
  audiobookshelf:
    image: advplyr/audiobookshelf:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_AUDIOBOOKSHELF_PORT:-13378}:80"
    volumes:
      - audiobookshelf_data:/audiobooks
      - audiobookshelf_podcasts:/podcasts
      - audiobookshelf_config:/config
      - audiobookshelf_metadata:/metadata
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:80/healthcheck', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  audiobookshelf_data:
  audiobookshelf_podcasts:
  audiobookshelf_config:
  audiobookshelf_metadata:
