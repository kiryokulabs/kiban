services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    environment:
      HBOX_MODE: release
      HBOX_WEB_PORT: 7745
      HBOX_AUTH_API_KEY_PEPPER: ${KIBAN_HOMEBOX_API_KEY_PEPPER:-kiban-homebox-api-key-pepper-2026-secure}
    ports:
      - "${KIBAN_HOMEBOX_PORT:-3000}:7745"
    volumes:
      - homebox_data:/data
volumes:
  homebox_data:
