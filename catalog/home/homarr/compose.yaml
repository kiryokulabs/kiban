services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_HOMARR_PORT:-7575}:7575"
    volumes:
      - homarr_appdata:/appdata
    environment:
      SECRET_ENCRYPTION_KEY: ${KIBAN_HOMARR_ENCRYPTION_KEY:-83c4a0910199866716fdedf22c1949ccf8a470bd9f8260583246aaecffcc825e}
      KIBAN_HOMARR_PORT: ${KIBAN_HOMARR_PORT:-7575}
      KIBAN_HOMARR_ENCRYPTION_KEY: ${KIBAN_HOMARR_ENCRYPTION_KEY:-83c4a0910199866716fdedf22c1949ccf8a470bd9f8260583246aaecffcc825e}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7575 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  homarr_appdata:
