services:
  vert:
    image: ghcr.io/vert-sh/vert:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_VERT_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
