services:
  postgresql:
    image: postgres:17
    restart: unless-stopped
    command: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kiban}
      POSTGRES_USER: ${POSTGRES_USER:-kiban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiban}
    expose:
      - "5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
volumes:
  postgresql_data:
