services:
  postgresql:
    image: postgres:17
    restart: unless-stopped
    command: postgres
    environment:
      POSTGRES_DB: ${KIBAN_POSTGRES_DB:-kiban}
      POSTGRES_USER: ${KIBAN_POSTGRES_USER:-kiban}
      POSTGRES_PASSWORD: ${KIBAN_POSTGRES_PASSWORD:-kiban}
    ports:
      - "${KIBAN_POSTGRESQL_PORT:-5432}:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
volumes:
  postgresql_data:
