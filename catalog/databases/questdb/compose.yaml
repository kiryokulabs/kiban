services:
  questdb:
    image: questdb/questdb:9.4.3
    restart: unless-stopped
    expose:
      - "9000"
      - "8812"
      - "9009"
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  questdb_data:
