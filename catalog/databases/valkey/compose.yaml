services:
  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    command: valkey-server --requirepass ${KIBAN_VALKEY_PASSWORD:-kiban}
    environment:
      KIBAN_VALKEY_PASSWORD: ${KIBAN_VALKEY_PASSWORD:-kiban}
    expose:
      - "6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $${KIBAN_VALKEY_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  valkey_data:
