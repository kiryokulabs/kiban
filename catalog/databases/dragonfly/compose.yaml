services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    command: dragonfly --requirepass ${KIBAN_DRAGONFLY_PASSWORD:-kiban}
    environment:
      KIBAN_DRAGONFLY_PASSWORD: ${KIBAN_DRAGONFLY_PASSWORD:-kiban}
    ports:
      - "${KIBAN_DRAGONFLY_PORT:-6380}:6379"
    volumes:
      - dragonfly_data:/data
volumes:
  dragonfly_data:
