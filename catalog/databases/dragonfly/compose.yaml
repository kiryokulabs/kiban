services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    restart: unless-stopped
    command: dragonfly --requirepass ${DRAGONFLY_PASSWORD:-kiban}
    environment:
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD:-kiban}
    expose:
      - "6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${DRAGONFLY_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  dragonfly_data:
