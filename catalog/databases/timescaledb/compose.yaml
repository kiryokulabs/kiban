services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KIBAN_TIMESCALE_DB:-kiban}
      POSTGRES_USER: ${KIBAN_TIMESCALE_USER:-postgres}
      POSTGRES_PASSWORD: ${KIBAN_TIMESCALE_PASSWORD:-kiban}
      KIBAN_TIMESCALE_DB: ${KIBAN_TIMESCALE_DB:-kiban}
      KIBAN_TIMESCALE_USER: ${KIBAN_TIMESCALE_USER:-postgres}
      KIBAN_TIMESCALE_PASSWORD: ${KIBAN_TIMESCALE_PASSWORD:-kiban}
    ports:
      - "${KIBAN_TIMESCALE_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KIBAN_TIMESCALE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  timescaledb_data:
