services:
  mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kiban}
      MYSQL_USER: ${MYSQL_USER:-kiban}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kiban}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiban}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  mysql_data:
