services:
  mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${KIBAN_MYSQL_DATABASE:-kiban}
      MYSQL_USER: ${KIBAN_MYSQL_USER:-kiban}
      MYSQL_PASSWORD: ${KIBAN_MYSQL_PASSWORD:-kiban}
      MYSQL_ROOT_PASSWORD: ${KIBAN_MYSQL_ROOT_PASSWORD:-kiban}
    ports:
      - "${KIBAN_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
