services:
  influxdb:
    image: influxdb:2
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${KIBAN_INFLUXDB_USERNAME:-kiban}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${KIBAN_INFLUXDB_PASSWORD:-kiban12345}
      DOCKER_INFLUXDB_INIT_ORG: ${KIBAN_INFLUXDB_ORG:-kiban}
      DOCKER_INFLUXDB_INIT_BUCKET: ${KIBAN_INFLUXDB_BUCKET:-default}
    ports:
      - "${KIBAN_INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
volumes:
  influxdb_data:
