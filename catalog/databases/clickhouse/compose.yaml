services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.3.7
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-kiban}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kiban}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kiban}
    expose:
      - "8123"
      - "9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  clickhouse_data:
