services:
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: memcached --memory-limit=${MEMCACHED_MEMORY:-256}m --conn-limit=1024 --threads=4
    environment:
      MEMCACHED_MEMORY: ${MEMCACHED_MEMORY:-256}
    expose:
      - "11211"
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc 127.0.0.1 11211 | grep STAT"]
      interval: 10s
      timeout: 5s
      retries: 5
