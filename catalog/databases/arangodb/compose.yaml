services:
  arangodb:
    image: arangodb:3.12
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: ${KIBAN_ARANGO_PASSWORD:-kiban}
      KIBAN_ARANGO_PASSWORD: ${KIBAN_ARANGO_PASSWORD:-kiban}
    ports:
      - "${KIBAN_ARANGODB_PORT:-8529}:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps
volumes:
  arangodb_data:
  arangodb_apps:
