services:
  elasticsearch:
    image: elasticsearch:9.4.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${KIBAN_ES_JAVA_OPTS:-"-Xms512m -Xmx512m"}
      KIBAN_ES_JAVA_OPTS: ${KIBAN_ES_JAVA_OPTS:-"-Xms512m -Xmx512m"}
    expose:
      - "9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  elasticsearch_data:
