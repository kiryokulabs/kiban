services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-kiban}
      MARIADB_USER: ${MARIADB_USER:-kiban}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-kiban}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-kiban}
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  mariadb_data:
