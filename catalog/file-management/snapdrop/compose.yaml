services:
  snapdrop:
    image: lscr.io/linuxserver/snapdrop:b8b78cc2-ls173
    restart: unless-stopped
    ports:
      - "${KIBAN_SNAPDROP_PORT:-80}:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      KIBAN_SNAPDROP_PORT: ${KIBAN_SNAPDROP_PORT:-80}
    volumes:
      - snapdrop_config:/config
volumes:
  snapdrop_config:
