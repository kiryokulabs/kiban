services:
  humhub:
    image: humhub/humhub:1.18.6
    restart: unless-stopped
    depends_on:
      humhub-db:
        condition: service_healthy
    ports:
      - "${KIBAN_HUMHUB_PORT:-80}:80"
    environment:
      SERVER_NAME: ${SERVICE_FQDN_HUMHUB:-localhost}
      HUMHUB_CONFIG__COMPONENTS__DB__DSN: mysql:host=humhub-db;dbname=humhub
      HUMHUB_CONFIG__COMPONENTS__DB__USERNAME: humhub
      HUMHUB_CONFIG__COMPONENTS__DB__PASSWORD: ${KIBAN_HUMHUB_DB_PASSWORD:-humhub-password}
      KIBAN_HUMHUB_PORT: ${KIBAN_HUMHUB_PORT:-80}
      KIBAN_HUMHUB_DB_PASSWORD: ${KIBAN_HUMHUB_DB_PASSWORD:-humhub-password}
      KIBAN_HUMHUB_DB_ROOT_PASSWORD: ${KIBAN_HUMHUB_DB_ROOT_PASSWORD:-humhub-root-password}
    volumes:
      - humhub_data:/data
      - humhub_uploads:/var/www/localhost/htdocs/uploads
      - humhub_modules:/var/www/localhost/htdocs/protected/modules
      - humhub_themes:/var/www/localhost/htdocs/themes
  humhub-db:
    image: mariadb:11.8.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: humhub
      MARIADB_USER: humhub
      MARIADB_PASSWORD: ${KIBAN_HUMHUB_DB_PASSWORD:-humhub-password}
      MARIADB_ROOT_PASSWORD: ${KIBAN_HUMHUB_DB_ROOT_PASSWORD:-humhub-root-password}
    volumes:
      - humhub_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  humhub_data:
  humhub_uploads:
  humhub_modules:
  humhub_themes:
  humhub_db:
