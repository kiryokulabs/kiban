services:
  jenkins:
    image: jenkins/jenkins:lts
    restart: unless-stopped
    environment:
      JAVA_OPTS: ${KIBAN_JENKINS_JAVA_OPTS:-"-Xms512m -Xmx512m"}
      KIBAN_JENKINS_JAVA_OPTS: ${KIBAN_JENKINS_JAVA_OPTS:-"-Xms512m -Xmx512m"}
    ports:
      - "${KIBAN_JENKINS_PORT:-8080}:8080"
      - "${KIBAN_JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
volumes:
  jenkins_data:
