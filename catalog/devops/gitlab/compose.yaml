services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    restart: unless-stopped
    environment:
      GITLAB_OMNIBUS_CONFIG: "external_url 'http://localhost:${KIBAN_GITLAB_PORT:-80}'"
    ports:
      - "${KIBAN_GITLAB_PORT:-80}:80"
      - "${KIBAN_GITLAB_SSH_PORT:-2222}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
