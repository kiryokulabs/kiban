services:
  cap:
    image: tiago2/cap:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      ADMIN_KEY: ${CAP_ADMIN_KEY:-kiban-kiban-kiban-kiban-kiban-kiban-kiban-kiban}
      REDIS_URL: redis://valkey:6379
    ports:
      - "${KIBAN_CAP_PORT:-8080}:3000"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://'+process.env.HOSTNAME+':3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - cap_data:/app/data

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - cap_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cap_data:
  cap_valkey_data:
