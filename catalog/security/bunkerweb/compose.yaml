services:
  bunkerweb:
    image: bunkerity/bunkerweb-all-in-one:1.6.15
    restart: unless-stopped
    ports:
      - "${KIBAN_BUNKERWEB_HTTP_PORT:-8080}:8080/tcp"
      - "${KIBAN_BUNKERWEB_HTTPS_PORT:-8443}:8443/tcp"
      - "${KIBAN_BUNKERWEB_HTTPS_PORT:-8443}:8443/udp"
      - "${KIBAN_BUNKERWEB_UI_PORT:-7000}:7000"
    environment:
      KIBAN_BUNKERWEB_HTTP_PORT: ${KIBAN_BUNKERWEB_HTTP_PORT:-8080}
      KIBAN_BUNKERWEB_HTTPS_PORT: ${KIBAN_BUNKERWEB_HTTPS_PORT:-8443}
      KIBAN_BUNKERWEB_UI_PORT: ${KIBAN_BUNKERWEB_UI_PORT:-7000}
    volumes:
      - bunkerweb_data:/data
volumes:
  bunkerweb_data:
