services:
  authelia:
    image: authelia/authelia:latest
    restart: unless-stopped
    environment:
      AUTHELIA_SERVER_PORT: 9091
    ports:
      - "${KIBAN_AUTHELIA_PORT:-9091}:9091"
    volumes:
      - authelia_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  authelia_config:
