services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    restart: unless-stopped
    environment:
      WG_HOST: ${KIBAN_WG_HOST:-localhost}
      PASSWORD_HASH: ${KIBAN_WG_PASSWORD_HASH:-$$2a$$12$$placeholder}
      KIBAN_WG_HOST: ${KIBAN_WG_HOST:-localhost}
      KIBAN_WG_PASSWORD_HASH: ${KIBAN_WG_PASSWORD_HASH:-$$2a$$12$$placeholder}
      PORT: 51821
      WG_PORT: 51820
      WG_DEFAULT_DNS: 1.1.1.1,8.8.8.8
    ports:
      - "51820:51820/udp"
      - "${KIBAN_WG_PORT:-51821}:51821"
    volumes:
      - wg_data:/etc/wireguard
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:51821"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  wg_data:
