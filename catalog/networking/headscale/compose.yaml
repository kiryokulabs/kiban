services:
  headscale:
    image: headscale/headscale:stable
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - headscale_data:/var/lib/headscale
    command: serve
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  headscale-ui:
    image: ghcr.io/glenrow/ghcr.io/ghcr.io/headscale-webui/headscale-webui:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_HEADSCALE_PORT:-8080}:8080"
    depends_on:
      headscale:
        condition: service_healthy
    environment:
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      OIDC_ISSUER_URL: ""
      HEADSCALE_URL: http://headscale:8080
      COOKIE_SECRET: ${KIBAN_HEADSCALE_COOKIE_SECRET:-change-me-cookie-secret}
      KIBAN_HEADSCALE_PORT: ${KIBAN_HEADSCALE_PORT:-8080}
volumes:
  headscale_data:
