services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_NPM_HTTP_PORT:-80}:80"
      - "${KIBAN_NPM_ADMIN_PORT:-81}:81"
      - "${KIBAN_NPM_HTTPS_PORT:-443}:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  npm_data:
  npm_letsencrypt:
