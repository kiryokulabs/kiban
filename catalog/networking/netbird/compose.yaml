services:
  netbird:
    image: netbirdio/dashboard:0.58.2
    restart: unless-stopped
    ports:
      - "${KIBAN_NETBIRD_PORT:-80}:80"
    environment:
      KIBAN_NETBIRD_PORT: ${KIBAN_NETBIRD_PORT:-80}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || curl -f http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
