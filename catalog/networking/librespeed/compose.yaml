services:
  librespeed:
    image: lscr.io/linuxserver/librespeed:v6.3.0-ls293
    restart: unless-stopped
    ports:
      - "${KIBAN_LIBRESPEED_PORT:-80}:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      MODE: standalone
      TELEMETRY: "true"
      ENABLE_ID_OBFUSCATION: "true"
      PASSWORD: ${KIBAN_LIBRESPEED_STATS_PASSWORD:-librespeed-stats-password}
      KIBAN_LIBRESPEED_PORT: ${KIBAN_LIBRESPEED_PORT:-80}
      KIBAN_LIBRESPEED_STATS_PASSWORD: ${KIBAN_LIBRESPEED_STATS_PASSWORD:-librespeed-stats-password}
    volumes:
      - librespeed_config:/config
volumes:
  librespeed_config:
