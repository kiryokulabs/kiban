services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${KIBAN_JAEGER_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:14269/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
