services:
  thanos-query:
    image: thanosio/thanos:v0.42.0
    restart: unless-stopped
    command:
      - query
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10903
    ports:
      - "${KIBAN_THANOS_PORT:-10902}:10902"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10902/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
