services:
  graylog-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - graylog_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  graylog-opensearch:
    image: opensearchproject/opensearch:2.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - graylog_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  graylog:
    image: graylog/graylog:7.1
    restart: unless-stopped
    ports:
      - "${KIBAN_GRAYLOG_PORT:-9000}:9000"
      - "12201:12201"
      - "12201:12201/udp"
    depends_on:
      graylog-mongo:
        condition: service_healthy
      graylog-opensearch:
        condition: service_healthy
    environment:
      GRAYLOG_PASSWORD_SECRET: ${KIBAN_GRAYLOG_PASSWORD_SECRET:-change-me-password-secret}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${KIBAN_GRAYLOG_ROOT_PASSWORD_SHA2:-}
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:${KIBAN_GRAYLOG_PORT:-9000}
      GRAYLOG_ELASTICSEARCH_HOSTS: http://graylog-opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://graylog-mongo:27017/graylog
      KIBAN_GRAYLOG_PORT: ${KIBAN_GRAYLOG_PORT:-9000}
      KIBAN_GRAYLOG_PASSWORD_SECRET: ${KIBAN_GRAYLOG_PASSWORD_SECRET:-change-me-password-secret}
      KIBAN_GRAYLOG_ROOT_PASSWORD_SHA2: ${KIBAN_GRAYLOG_ROOT_PASSWORD_SHA2:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/system/lbstatus"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
volumes:
  graylog_mongo_data:
  graylog_opensearch_data:
