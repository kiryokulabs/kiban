services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    restart: unless-stopped
    ports:
      - "${KIBAN_VM_PORT:-8428}:8428"
    volumes:
      - vm_data:/victoria-metrics-data
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=:8428
      - -retentionPeriod=90d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  vm_data:
