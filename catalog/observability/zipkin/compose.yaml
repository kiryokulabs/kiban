services:
  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    ports:
      - "${KIBAN_ZIPKIN_PORT:-9411}:9411"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
