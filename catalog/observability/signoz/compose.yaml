services:
  signoz-standalone:
    image: signoz/signoz-standalone:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_SIGNOZ_PORT:-8080}:8080"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - signoz_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  signoz_data:
