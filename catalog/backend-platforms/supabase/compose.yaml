services:
  # ─────────────────────────────────────────────
  # Studio (Dashboard UI)
  # ─────────────────────────────────────────────
  studio:
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 30s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${KIBAN_SUPABASE_POSTGRES_PORT:-5432}
      POSTGRES_HOST: db
      POSTGRES_DB: ${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${KIBAN_SUPABASE_PG_META_CRYPTO_KEY:-kiban-pg-meta-crypto-key-32-chars-min}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: Default Organization
      DEFAULT_PROJECT_NAME: Default Project
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SERVICE_URL_SUPABASE}
      SUPABASE_ANON_KEY: ${KIBAN_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      SUPABASE_SERVICE_KEY: ${KIBAN_SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      AUTH_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SUPABASE_PUBLISHABLE_KEY: ${KIBAN_SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${KIBAN_SUPABASE_SECRET_KEY:-}
      ENABLED_FEATURES_LOGS_ALL: "false"
    volumes:
      - type: bind
        source: ./volumes/snippets/.gitkeep
        target: /app/snippets/.gitkeep
        content: |
          # Studio snippets folder placeholder
      - type: bind
        source: ./volumes/functions/main/index.ts
        target: /app/edge-functions/main/index.ts
        content: |
          import { serve } from "https://deno.land/std@0.168.0/http/server.ts";
          serve(() => new Response("OK"));

  # ─────────────────────────────────────────────
  # Envoy API Gateway
  # ─────────────────────────────────────────────
  api-gw:
    image: envoyproxy/envoy:v1.39.0
    restart: unless-stopped
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
    ports:
      - "${KIBAN_SUPABASE_PORT:-8000}:8000/tcp"
    volumes:
      - type: bind
        source: ./volumes/api/envoy/envoy.yaml
        target: /etc/envoy/envoy.yaml
        content: |
          dynamic_resources:
            cds_config:
              path_config_source:
                path: /etc/envoy/cds.yaml
              resource_api_version: V3
            lds_config:
              path_config_source:
                path: /etc/envoy/lds.yaml
              resource_api_version: V3
          node:
            cluster: supabase_cluster
            id: supabase_node
          overload_manager:
            resource_monitors:
              - name: envoy.resource_monitors.global_downstream_max_connections
                typed_config:
                  '@type': >-
                    type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
                  max_active_downstream_connections: 30000
          admin:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901
      - type: bind
        source: ./volumes/api/envoy/cds.yaml
        target: /etc/envoy/cds.yaml
        content: |
          resources:
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: auth
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: auth
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: auth
                              port_value: 9999
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /health
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: rest
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: rest
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: rest
                              port_value: 3000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: realtime
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: realtime
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: realtime-dev.supabase-realtime
                              port_value: 4000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: storage
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: storage
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: storage
                              port_value: 5000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /status
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: functions
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: functions
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: functions
                              port_value: 9000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  tcp_health_check: {}
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: meta
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: meta
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: meta
                              port_value: 8080
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /health
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: studio
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: studio
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: studio
                              port_value: 3000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /project/default
      - type: bind
        source: ./volumes/api/envoy/lds.yaml
        target: /etc/envoy/lds.yaml
        content: |
          resources:
            - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
              name: supabase
              per_connection_buffer_limit_bytes: 32768
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 8000
              filter_chains:
                - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                        stat_prefix: ingress_http
                        normalize_path: true
                        merge_slashes: true
                        path_with_escaped_slashes_action: REJECT_REQUEST
                        use_remote_address: true
                        common_http_protocol_options:
                          headers_with_underscores_action: REJECT_REQUEST
                        upgrade_configs:
                          - upgrade_type: websocket
                        route_config:
                          name: supabase_route
                          virtual_hosts:
                            - name: supabase_host
                              domains:
                                - '*'
                              cors:
                                allow_origin_string_match:
                                  - safe_regex:
                                      regex: ".*"
                                allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD,CONNECT,TRACE"
                                allow_headers: "*"
                                expose_headers: "*"
                                max_age: "3600"
                              request_headers_to_add:
                                - header:
                                    key: X-Forwarded-Host
                                    value: "%REQ(:AUTHORITY)%"
                                  append_action: ADD_IF_ABSENT
                                - header:
                                    key: X-Forwarded-Port
                                    value: "%DOWNSTREAM_LOCAL_PORT%"
                                  append_action: ADD_IF_ABSENT
                              routes:
                                - match:
                                    prefix: /auth/v1/verify
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /verify
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/verify
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /auth/v1/callback
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /callback
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/callback
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /auth/v1/authorize
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /authorize
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/authorize
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /auth/v1/.well-known/jwks.json
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /.well-known/jwks.json
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/.well-known/jwks.json
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /.well-known/oauth-authorization-server
                                  route:
                                    cluster: auth
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /.well-known/oauth-authorization-server
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /auth/v1/sso/saml/acs
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /sso/saml/acs
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/sso/saml/acs
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /auth/v1/sso/saml/metadata
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /sso/saml/metadata
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/sso/saml/metadata
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /functions/v1/
                                  route:
                                    cluster: functions
                                    prefix_rewrite: /
                                    timeout: 150s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /functions/v1/
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /storage/v1/
                                  route:
                                    cluster: storage
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /storage/v1
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /auth/v1/
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    path: /rest/v1/
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /rest/v1/
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /rest/v1/
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /rest/v1/
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /graphql/v1
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /rpc/graphql
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /graphql/v1
                                      append_action: ADD_IF_ABSENT
                                    - header:
                                        key: Content-Profile
                                        value: graphql_public
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /realtime/v1/api
                                  route:
                                    cluster: realtime
                                    prefix_rewrite: /api
                                    timeout: 30s
                                    host_rewrite_literal: realtime-dev.supabase-realtime
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /realtime/v1/api
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /realtime/v1/
                                  route:
                                    cluster: realtime
                                    prefix_rewrite: /socket/
                                    timeout: 30s
                                    host_rewrite_literal: realtime-dev.supabase-realtime
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /realtime/v1/
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /pg/
                                  route:
                                    cluster: meta
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /pg/
                                      append_action: ADD_IF_ABSENT
                                - match:
                                    prefix: /
                                  route:
                                    cluster: studio
                                    timeout: 30s
                                  request_headers_to_remove:
                                    - authorization
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /
                                      append_action: ADD_IF_ABSENT
                        http_filters:
                          - name: envoy.filters.http.cors
                            typed_config:
                              '@type': >-
                                type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                          - name: envoy.filters.http.router
                            typed_config:
                              '@type': >-
                                type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - type: bind
        source: ./volumes/api/envoy/docker-entrypoint.sh
        target: /docker-entrypoint.sh
        content: |
          #!/bin/sh
          set -e
          envoy -c /etc/envoy/envoy.yaml
    environment:
      ANON_KEY: ${KIBAN_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      SERVICE_ROLE_KEY: ${KIBAN_SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      SUPABASE_PUBLISHABLE_KEY: ${KIBAN_SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${KIBAN_SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${KIBAN_SUPABASE_ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${KIBAN_SUPABASE_SERVICE_ROLE_KEY_ASYMMETRIC:-}
      DASHBOARD_USERNAME: ${KIBAN_SUPABASE_DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${KIBAN_SUPABASE_DASHBOARD_PASSWORD:-this_password_is_insecure_and_should_be_updated}
      DASHBOARD_BASIC_AUTH: ${KIBAN_SUPABASE_DASHBOARD_USERNAME:-supabase}:${KIBAN_SUPABASE_DASHBOARD_PASSWORD:-this_password_is_insecure_and_should_be_updated}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

  # ─────────────────────────────────────────────
  # Auth (GoTrue)
  # ─────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SERVICE_URL_SUPABASE}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}@db:${KIBAN_SUPABASE_POSTGRES_PORT:-5432}/${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SERVICE_URL_SUPABASE}
      GOTRUE_URI_ALLOW_LIST: ${KIBAN_SUPABASE_ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${KIBAN_SUPABASE_GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${KIBAN_SUPABASE_JWT_EXP:-3600}
      GOTRUE_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_ISSUER: ${SERVICE_URL_SUPABASE}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${KIBAN_SUPABASE_GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${KIBAN_SUPABASE_GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${KIBAN_SUPABASE_GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${KIBAN_SUPABASE_SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_SMTP_HOST: ${KIBAN_SUPABASE_SMTP_HOST:-supabase-mail}
      GOTRUE_SMTP_PORT: ${KIBAN_SUPABASE_SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${KIBAN_SUPABASE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${KIBAN_SUPABASE_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${KIBAN_SUPABASE_SMTP_SENDER_NAME:-}
      SMTP_ADMIN_EMAIL: ${KIBAN_SUPABASE_SMTP_ADMIN_EMAIL:-admin@example.com}
      SMTP_HOST: ${KIBAN_SUPABASE_SMTP_HOST:-supabase-mail}
      SMTP_PORT: ${KIBAN_SUPABASE_SMTP_PORT:-2500}
      SMTP_USER: ${KIBAN_SUPABASE_SMTP_USER:-}
      SMTP_PASS: ${KIBAN_SUPABASE_SMTP_PASS:-}
      SMTP_SENDER_NAME: ${KIBAN_SUPABASE_SMTP_SENDER_NAME:-}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${KIBAN_SUPABASE_GOTRUE_EXTERNAL_PHONE_ENABLED:-true}
      GOTRUE_SMS_AUTOCONFIRM: ${KIBAN_SUPABASE_GOTRUE_SMS_AUTOCONFIRM:-true}

  # ─────────────────────────────────────────────
  # REST (PostgREST)
  # ─────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}@db:${KIBAN_SUPABASE_POSTGRES_PORT:-5432}/${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: ${KIBAN_SUPABASE_JWT_EXP:-3600}

  # ─────────────────────────────────────────────
  # Realtime
  # ─────────────────────────────────────────────
  realtime:
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: ${KIBAN_SUPABASE_POSTGRES_PORT:-5432}
      DB_USER: supabase_admin
      DB_PASSWORD: ${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}
      DB_NAME: ${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${KIBAN_SUPABASE_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SECRET_KEY_BASE: ${KIBAN_SUPABASE_SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
      METRICS_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      ANON_KEY: ${KIBAN_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}

  # ─────────────────────────────────────────────
  # Storage
  # ─────────────────────────────────────────────
  storage:
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${KIBAN_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      SERVICE_KEY: ${KIBAN_SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      DATABASE_URL: postgres://supabase_storage_admin:${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}@db:${KIBAN_SUPABASE_POSTGRES_PORT:-5432}/${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${SERVICE_URL_SUPABASE}/storage/v1
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - supabase_storage:/var/lib/storage

  # ─────────────────────────────────────────────
  # imgproxy (Image Transformation)
  # ─────────────────────────────────────────────
  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    platform: linux/amd64
    volumes:
      - supabase_storage:/var/lib/storage
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"

  # ─────────────────────────────────────────────
  # Postgres Meta
  # ─────────────────────────────────────────────
  meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: ${KIBAN_SUPABASE_POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}
      CRYPTO_KEY: ${KIBAN_SUPABASE_PG_META_CRYPTO_KEY:-kiban-pg-meta-crypto-key-32-chars-min}

  # ─────────────────────────────────────────────
  # Edge Functions
  # ─────────────────────────────────────────────
  functions:
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    platform: linux/amd64
    volumes:
      - type: bind
        source: ./volumes/functions/main/index.ts
        target: /home/deno/functions/main/index.ts
        content: |
          import { serve } from "https://deno.land/std@0.168.0/http/server.ts";
          serve(() => new Response("OK"));
      - deno-cache:/root/.cache/deno
    depends_on:
      api-gw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SERVICE_URL_SUPABASE}
      SUPABASE_ANON_KEY: ${KIBAN_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      SUPABASE_SERVICE_ROLE_KEY: ${KIBAN_SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      SUPABASE_DB_URL: postgresql://postgres:${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}@db:${KIBAN_SUPABASE_POSTGRES_PORT:-5432}/${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      VERIFY_JWT: "false"
    command: ["start", "--main-service", "/home/deno/functions/main"]

  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    platform: linux/amd64
    volumes:
      - type: bind
        source: ./volumes/db/realtime.sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`
          create schema if not exists _realtime;
          alter schema _realtime owner to :pguser;
      - type: bind
        source: ./volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        content: |
          BEGIN;
            CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
            CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
            GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
            CREATE TABLE supabase_functions.migrations (version text PRIMARY KEY, inserted_at timestamptz NOT NULL DEFAULT NOW());
            INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
            CREATE TABLE supabase_functions.hooks (id bigserial PRIMARY KEY, hook_table_id integer NOT NULL, hook_name text NOT NULL, created_at timestamptz NOT NULL DEFAULT NOW(), request_id bigint);
            CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
            CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
            COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
            CREATE FUNCTION supabase_functions.http_request() RETURNS trigger LANGUAGE plpgsql AS $function$ DECLARE request_id bigint; payload jsonb; url text := TG_ARGV[0]::text; method text := TG_ARGV[1]::text; headers jsonb DEFAULT '{}'::jsonb; params jsonb DEFAULT '{}'::jsonb; timeout_ms integer DEFAULT 1000; BEGIN IF url IS NULL OR url = 'null' THEN RAISE EXCEPTION 'url argument is missing'; END IF; IF method IS NULL OR method = 'null' THEN RAISE EXCEPTION 'method argument is missing'; END IF; IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN headers = '{"Content-Type": "application/json"}'::jsonb; ELSE headers = TG_ARGV[2]::jsonb; END IF; IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN params = '{}'::jsonb; ELSE params = TG_ARGV[3]::jsonb; END IF; IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN timeout_ms = 1000; ELSE timeout_ms = TG_ARGV[4]::integer; END IF; CASE WHEN method = 'GET' THEN SELECT http_get INTO request_id FROM net.http_get(url, params, headers, timeout_ms); WHEN method = 'POST' THEN payload = jsonb_build_object('old_record', OLD, 'record', NEW, 'type', TG_OP, 'table', TG_TABLE_NAME, 'schema', TG_TABLE_SCHEMA); SELECT http_post INTO request_id FROM net.http_post(url, payload, params, headers, timeout_ms); ELSE RAISE EXCEPTION 'method argument % is invalid', method; END CASE; INSERT INTO supabase_functions.hooks (hook_table_id, hook_name, request_id) VALUES (TG_RELID, TG_NAME, request_id); RETURN NEW; END $function$;
            DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_functions_admin') THEN CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION; END IF; END $$;
            GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
            ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
            ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
            ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
            ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
            GRANT supabase_functions_admin TO postgres;
            ALTER function supabase_functions.http_request() SECURITY DEFINER;
            ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
            REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
          COMMIT;
      - type: bind
        source: ./volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        content: |
          \set pgpass `echo "$POSTGRES_PASSWORD"`
          ALTER USER authenticator WITH PASSWORD :'pgpass';
          ALTER USER pgbouncer WITH PASSWORD :'pgpass';
          ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
          ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
          ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';
      - type: bind
        source: ./volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        content: |
          \set jwt_secret `echo "$JWT_SECRET"`
          \set jwt_exp `echo "$JWT_EXP"`
          ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
          ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';
      - type: bind
        source: ./volumes/db/_supabase.sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`
          CREATE DATABASE _supabase WITH OWNER :pguser;
      - type: bind
        source: ./volumes/db/logs.sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`
          \c _supabase
          create schema if not exists _analytics;
          alter schema _analytics owner to :pguser;
          \c postgres
      - type: bind
        source: ./volumes/db/pooler.sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`
          \c _supabase
          create schema if not exists _supavisor;
          alter schema _supavisor owner to :pguser;
          \c postgres
      - supabase-db:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${KIBAN_SUPABASE_POSTGRES_PORT:-5432}
      POSTGRES_PORT: ${KIBAN_SUPABASE_POSTGRES_PORT:-5432}
      PGPASSWORD: ${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}
      POSTGRES_PASSWORD: ${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}
      PGDATABASE: ${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      POSTGRES_DB: ${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      JWT_EXP: ${KIBAN_SUPABASE_JWT_EXP:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  # ─────────────────────────────────────────────
  # Supavisor (Connection Pooler)
  # ─────────────────────────────────────────────
  supavisor:
    image: supabase/supavisor:2.9.5
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "${KIBAN_SUPABASE_POSTGRES_PORT:-5432}:5432"
      - "${KIBAN_SUPABASE_POOLER_PROXY_PORT_TRANSACTION:-6543}:6543"
    volumes:
      - type: bind
        source: ./volumes/pooler/pooler.exs
        target: /etc/pooler/pooler.exs
        content: |
          {:ok, _} = Application.ensure_all_started(:supavisor)

          {:ok, version} =
            case Supavisor.Repo.query!("select version()") do
              %{rows: [[ver]]} -> Supavisor.Helpers.parse_pg_version(ver)
              _ -> nil
            end

          params = %{
            "external_id" => System.get_env("POOLER_TENANT_ID"),
            "db_host" => System.get_env("POSTGRES_HOST") || "db",
            "db_port" => System.get_env("POSTGRES_PORT"),
            "db_database" => System.get_env("POSTGRES_DB"),
            "require_user" => false,
            "auth_query" => "SELECT * FROM pgbouncer.get_auth($1)",
            "default_max_clients" => System.get_env("POOLER_MAX_CLIENT_CONN"),
            "default_pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
            "default_parameter_status" => %{"server_version" => version},
            "users" => [%{
              "db_user" => "pgbouncer",
              "db_password" => System.get_env("POSTGRES_PASSWORD"),
              "mode_type" => System.get_env("POOLER_POOL_MODE"),
              "pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
              "is_manager" => true
            }]
          }

          if !Supavisor.Tenants.get_tenant_by_external_id(params["external_id"]) do
            {:ok, _} = Supavisor.Tenants.create_tenant(params)
          end
    healthcheck:
      test: ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      POSTGRES_PORT: ${KIBAN_SUPABASE_POSTGRES_PORT:-5432}
      POSTGRES_HOST: db
      POSTGRES_DB: ${KIBAN_SUPABASE_POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}
      POOLER_PROXY_PORT_TRANSACTION: ${KIBAN_SUPABASE_POOLER_PROXY_PORT_TRANSACTION:-6543}
      DATABASE_URL: ecto://supabase_admin:${KIBAN_SUPABASE_POSTGRES_PASSWORD:-kiban}@db/_supabase
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${KIBAN_SUPABASE_SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
      VAULT_ENC_KEY: ${KIBAN_SUPABASE_VAULT_ENC_KEY:-your-32-character-encryption-key}
      API_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      METRICS_JWT_SECRET: ${KIBAN_SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${KIBAN_SUPABASE_POOLER_TENANT_ID:-default}
      POOLER_DEFAULT_POOL_SIZE: ${KIBAN_SUPABASE_POOLER_DEFAULT_POOL_SIZE:-20}
      POOLER_MAX_CLIENT_CONN: ${KIBAN_SUPABASE_POOLER_MAX_CLIENT_CONN:-100}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${KIBAN_SUPABASE_DB_POOL_SIZE:-5}
    command: ["/bin/sh", "-c", "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"]

volumes:
  supabase-db:
  supabase_data:
  supabase_storage:
  deno-cache:
  db-config:
