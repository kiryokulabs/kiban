      test:
        - CMD-SHELL
        - curl -fsI http://localhost:80 | head -n 1 | grep -E '^HTTP/.* 3[0-9]{2} ' || exit 1
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  appwrite-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${KIBAN_APPWRITE_PORT:-80}:80"
    depends_on:
      appwrite:
        condition: service_healthy
      appwrite-console:
        condition: service_healthy
      appwrite-realtime:
        condition: service_started
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
            listen 80;
            server_name _;

            location /v1/realtime {
              proxy_pass http://appwrite-realtime:80;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
            }

            location /v1/ {
              proxy_pass http://appwrite:80;
              proxy_set_header Host $host;
            }

            location /console {
              proxy_pass http://appwrite-console:80;
              proxy_set_header Host $host;
            }

            location / {
              return 302 /console;
            }
          }

  appwrite-console:
    image: appwrite/console:6.1.28
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
