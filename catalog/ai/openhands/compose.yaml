services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_OPENHANDS_PORT:-3000}:3000"
    volumes:
      - openhands_workspace:/workspace
      - openhands_state:/home/openhands/.openhands
    environment:
      LLM_MODEL: ${KIBAN_OPENHANDS_LLM_MODEL:-claude-3-5-sonnet-20241022}
      LLM_API_KEY: ${KIBAN_OPENHANDS_LLM_API_KEY:-}
      SANDBOX_RUNTIME_CONTAINER_IMAGE: docker.all-hands.dev/all-hands-ai/runtime:0.28-nikolaik
      LOG_ALL_EVENTS: "true"
      KIBAN_OPENHANDS_PORT: ${KIBAN_OPENHANDS_PORT:-3000}
      KIBAN_OPENHANDS_LLM_MODEL: ${KIBAN_OPENHANDS_LLM_MODEL:-claude-3-5-sonnet-20241022}
      KIBAN_OPENHANDS_LLM_API_KEY: ${KIBAN_OPENHANDS_LLM_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  openhands_workspace:
  openhands_state:
