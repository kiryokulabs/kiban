services:
  comfyui:
    image: ghcr.io/ai-dock/comfyui:v2-cpu-22.04-v0.2.7
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${KIBAN_COMFYUI_PORT:-8188}:8188"
    volumes:
      - comfyui_models:/app/ComfyUI/models
      - comfyui_input:/app/ComfyUI/input
      - comfyui_output:/app/ComfyUI/output
      - comfyui_custom_nodes:/app/ComfyUI/custom_nodes
    environment:
      KIBAN_COMFYUI_PORT: ${KIBAN_COMFYUI_PORT:-8188}
      DIRECT_ADDRESS: ${SERVICE_FQDN_COMFYUI:-localhost}
      COMFYUI_URL: ${SERVICE_URL_COMFYUI:-http://localhost:8188}
      WEB_ENABLE_AUTH: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8188/system_stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
volumes:
  comfyui_models:
  comfyui_input:
  comfyui_output:
  comfyui_custom_nodes: