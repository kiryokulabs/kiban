services:
  fastgpt:
    image: ghcr.io/labring/fastgpt:latest
    restart: unless-stopped
    environment:
      DEFAULT_ROOT_PSW: ${KIBAN_FASTGPT_PASSWORD:-kiban}
      MONGO_URI: mongodb://fastgpt-mongo:27017/fastgpt?replicaSet=rs0
      PG_CONN_str: postgresql://${KIBAN_FASTGPT_PG_USER:-postgres}:${KIBAN_FASTGPT_PG_PASSWORD:-fastgpt}@fastgpt-pg:5432/fastgpt
      SSO_CONNECTION_GITHUB: ""
      KIBAN_FASTGPT_PASSWORD: ${KIBAN_FASTGPT_PASSWORD:-kiban}
      KIBAN_FASTGPT_PG_USER: ${KIBAN_FASTGPT_PG_USER:-postgres}
      KIBAN_FASTGPT_PG_PASSWORD: ${KIBAN_FASTGPT_PG_PASSWORD:-fastgpt}
    ports:
      - "${KIBAN_FASTGPT_PORT:-3000}:3000"
    depends_on:
      fastgpt-mongo:
        condition: service_healthy
      fastgpt-pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  fastgpt-mongo:
    image: mongo:7
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - fastgpt_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status().ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  fastgpt-pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastgpt
      POSTGRES_USER: ${KIBAN_FASTGPT_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${KIBAN_FASTGPT_PG_PASSWORD:-fastgpt}
    volumes:
      - fastgpt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KIBAN_FASTGPT_PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  fastgpt_mongo_data:
  fastgpt_pg_data:
