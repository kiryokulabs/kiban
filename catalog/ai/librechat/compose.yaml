services:
  librechat:
    image: librechat/librechat:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
    ports:
      - "${KIBAN_LIBRECHAT_PORT:-3080}:3080"
    depends_on:
      librechat-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  librechat-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - librechat_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  librechat_mongo_data:
