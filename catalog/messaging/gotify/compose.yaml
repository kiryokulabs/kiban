services:
  gotify:
    image: gotify/server:2.7.3
    restart: unless-stopped
    ports:
      - "${KIBAN_GOTIFY_PORT:-80}:80"
    environment:
      KIBAN_GOTIFY_PORT: ${KIBAN_GOTIFY_PORT:-80}
    volumes:
      - gotify_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || curl -f http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  gotify_data:
