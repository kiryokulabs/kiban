services:
  invoiceninja:
    image: invoiceninja/invoiceninja:latest
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:${KIBAN_INVOICENINJA_PORT:-8080}
      APP_KEY: ${KIBAN_INVOICENINJA_APP_KEY:-SomeRandomStringOf32CharsExactly}
      DB_HOST: invoiceninja-db
      DB_DATABASE: ${KIBAN_INVOICENINJA_DB_NAME:-invoiceninja}
      DB_USERNAME: ${KIBAN_INVOICENINJA_DB_USER:-invoiceninja}
      DB_PASSWORD: ${KIBAN_INVOICENINJA_DB_PASSWORD:-invoiceninja}
      KIBAN_INVOICENINJA_DB_NAME: ${KIBAN_INVOICENINJA_DB_NAME:-invoiceninja}
      KIBAN_INVOICENINJA_DB_USER: ${KIBAN_INVOICENINJA_DB_USER:-invoiceninja}
      KIBAN_INVOICENINJA_DB_PASSWORD: ${KIBAN_INVOICENINJA_DB_PASSWORD:-invoiceninja}
      KIBAN_INVOICENINJA_DB_ROOT_PASSWORD: ${KIBAN_INVOICENINJA_DB_ROOT_PASSWORD:-root}
      KIBAN_INVOICENINJA_APP_KEY: ${KIBAN_INVOICENINJA_APP_KEY:-SomeRandomStringOf32CharsExactly}
    ports:
      - "${KIBAN_INVOICENINJA_PORT:-8080}:80"
    depends_on:
      invoiceninja-db:
        condition: service_healthy
    volumes:
      - invoiceninja_public:/var/www/app/public
      - invoiceninja_storage:/var/www/app/storage
  invoiceninja-db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_DATABASE: ${KIBAN_INVOICENINJA_DB_NAME:-invoiceninja}
      MYSQL_USER: ${KIBAN_INVOICENINJA_DB_USER:-invoiceninja}
      MYSQL_PASSWORD: ${KIBAN_INVOICENINJA_DB_PASSWORD:-invoiceninja}
      MYSQL_ROOT_PASSWORD: ${KIBAN_INVOICENINJA_DB_ROOT_PASSWORD:-root}
    volumes:
      - invoiceninja_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  invoiceninja_public:
  invoiceninja_storage:
  invoiceninja_db_data:
