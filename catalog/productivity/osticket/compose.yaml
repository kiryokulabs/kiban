services:
  osticket:
    image: kerokoz/osticket-clean-slate:1.18.3
    restart: unless-stopped
    depends_on:
      osticket-db:
        condition: service_healthy
    ports:
      - "${KIBAN_OSTICKET_PORT:-80}:80"
    environment:
      MYSQL_HOST: osticket-db
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${KIBAN_OSTICKET_DB_PASSWORD:-osticket-password}
      KIBAN_OSTICKET_PORT: ${KIBAN_OSTICKET_PORT:-80}
      KIBAN_OSTICKET_DB_PASSWORD: ${KIBAN_OSTICKET_DB_PASSWORD:-osticket-password}
      KIBAN_OSTICKET_DB_ROOT_PASSWORD: ${KIBAN_OSTICKET_DB_ROOT_PASSWORD:-osticket-root-password}
    volumes:
      - osticket_data:/var/www/html
  osticket-db:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${KIBAN_OSTICKET_DB_PASSWORD:-osticket-password}
      MYSQL_ROOT_PASSWORD: ${KIBAN_OSTICKET_DB_ROOT_PASSWORD:-osticket-root-password}
    volumes:
      - osticket_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  osticket_data:
  osticket_db:
