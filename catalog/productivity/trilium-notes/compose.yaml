services:
  trilium-notes:
    image: triliumnext/trilium:v0.106.0
    restart: unless-stopped
    ports:
      - "${KIBAN_TRILIUM_NOTES_PORT:-8080}:8080"
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
      KIBAN_TRILIUM_NOTES_PORT: ${KIBAN_TRILIUM_NOTES_PORT:-8080}
    volumes:
      - trilium_notes_data:/home/node/trilium-data
volumes:
  trilium_notes_data:
