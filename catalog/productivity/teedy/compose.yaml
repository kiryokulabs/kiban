services:
  teedy:
    image: sismics/docs:v1.12
    restart: unless-stopped
    ports:
      - "${KIBAN_TEEDY_PORT:-8080}:8080"
    environment:
      DOCS_BASE_URL: http://localhost:${KIBAN_TEEDY_PORT:-8080}
      DATABASE_URL: jdbc:postgresql://teedy-db:5432/teedy
      DATABASE_USER: teedy
      DATABASE_PASSWORD: ${KIBAN_TEEDY_DB_PASSWORD:-teedy}
      KIBAN_TEEDY_PORT: ${KIBAN_TEEDY_PORT:-8080}
      KIBAN_TEEDY_DB_PASSWORD: ${KIBAN_TEEDY_DB_PASSWORD:-teedy}
    depends_on:
      - teedy-db
    volumes:
      - teedy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || curl -f http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  teedy-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teedy
      POSTGRES_USER: teedy
      POSTGRES_PASSWORD: ${KIBAN_TEEDY_DB_PASSWORD:-teedy}
    volumes:
      - teedy_db_data:/var/lib/postgresql/data
volumes:
  teedy_data:
  teedy_db_data:
