services:
  apache-answer:
    image: apache/answer:1.6.0
    restart: unless-stopped
    ports:
      - "${KIBAN_APACHE_ANSWER_PORT:-80}:80"
    environment:
      KIBAN_APACHE_ANSWER_PORT: ${KIBAN_APACHE_ANSWER_PORT:-80}
    volumes:
      - apache_answer_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || curl -f http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  apache_answer_data:
