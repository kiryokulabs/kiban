services:
  limesurvey:
    image: martialblog/limesurvey:7.4.0-260928-apache
    restart: unless-stopped
    ports:
      - "${KIBAN_LIMESURVEY_PORT:-8080}:8080"
    environment:
      DB_TYPE: mysql
      DB_HOST: limesurvey-db
      DB_PORT: 3306
      DB_NAME: limesurvey
      DB_USERNAME: limesurvey
      DB_PASSWORD: ${KIBAN_LIMESURVEY_DB_PASSWORD:-limesurvey}
      ADMIN_PASSWORD: ${KIBAN_LIMESURVEY_ADMIN_PASSWORD:-admin123456}
      KIBAN_LIMESURVEY_PORT: ${KIBAN_LIMESURVEY_PORT:-8080}
      KIBAN_LIMESURVEY_DB_PASSWORD: ${KIBAN_LIMESURVEY_DB_PASSWORD:-limesurvey}
      KIBAN_LIMESURVEY_ADMIN_PASSWORD: ${KIBAN_LIMESURVEY_ADMIN_PASSWORD:-admin123456}
    depends_on:
      - limesurvey-db
    volumes:
      - limesurvey_upload:/var/www/html/upload
  limesurvey-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: limesurvey
      MARIADB_USER: limesurvey
      MARIADB_PASSWORD: ${KIBAN_LIMESURVEY_DB_PASSWORD:-limesurvey}
    volumes:
      - limesurvey_db:/var/lib/mysql
volumes:
  limesurvey_upload:
  limesurvey_db:
