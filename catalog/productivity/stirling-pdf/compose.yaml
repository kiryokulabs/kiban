services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_STIRLING_PDF_PORT:-8080}:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SECURITY_ENABLE_LOGIN: "false"
      KIBAN_STIRLING_PDF_PORT: ${KIBAN_STIRLING_PDF_PORT:-8080}
    volumes:
      - stirling_data:/usr/share/tessdata
      - stirling_configs:/configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  stirling_data:
  stirling_configs:
