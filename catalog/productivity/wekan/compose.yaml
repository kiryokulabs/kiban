services:
  wekan:
    image: wekanteam/wekan:v7.95
    restart: unless-stopped
    ports:
      - "${KIBAN_WEKAN_PORT:-8080}:8080"
    environment:
      PORT: 8080
      ROOT_URL: http://localhost:${KIBAN_WEKAN_PORT:-8080}
      MONGO_URL: mongodb://wekan-db:27017/wekan
      WITH_API: "true"
      KIBAN_WEKAN_PORT: ${KIBAN_WEKAN_PORT:-8080}
    depends_on:
      - wekan-db
  wekan-db:
    image: mongo:6.0
    restart: unless-stopped
    command: ["mongod", "--logpath", "/dev/null"]
    volumes:
      - wekan_db:/data/db
volumes:
  wekan_db:
