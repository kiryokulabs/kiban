services:
  umami:
    image: ghcr.io/umami-software/umami:3.0.3
    environment:
      SERVICE_URL_UMAMI_3000: ${SERVICE_URL_UMAMI_3000:-http://localhost}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES:-admin}:${SERVICE_PASSWORD_POSTGRES:-kiban}@postgresql:5432/${POSTGRES_DB:-kiban}
      DATABASE_TYPE: postgres
      APP_SECRET: ${SERVICE_PASSWORD_64_UMAMI:-kiban-kiban-kiban-kiban-kiban-kiban-kiban-kiban}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3000/api/heartbeat
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped
    ports:
      - "3000"
  postgresql:
    image: postgres:16-alpine
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-admin}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-kiban}
      POSTGRES_DB: ${POSTGRES_DB:-umami}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped
volumes:
  postgresql-data: {}
