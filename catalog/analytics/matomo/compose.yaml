services:
  matomo:
    image: matomo:latest
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: ${MATOMO_TABLES_PREFIX:-matomo_}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:-kiban}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME:-matomo}
    ports:
      - "${MATOMO_PORT:-80}:80"
    volumes:
      - matomo_data:/data
  matomo-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MATOMO_DB_NAME:-matomo}
      MARIADB_USER: ${MATOMO_DB_USER:-matomo}
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:-kiban}
      MARIADB_ROOT_PASSWORD: ${MATOMO_ROOT_PASSWORD:-kiban}
    volumes:
      - matomo-db:/var/lib/mysql
volumes:
  matomo_data:
  matomo-db:
