services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - "${KIBAN_UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      KIBAN_UPTIME_KUMA_PORT: ${KIBAN_UPTIME_KUMA_PORT:-3001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  uptime_kuma_data:
