services:
  zabbix:
    image: zabbix/zabbix-web-nginx-pgsql:7.4.14-ubuntu
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
      zabbix-db:
        condition: service_healthy
    ports:
      - "${KIBAN_ZABBIX_PORT:-8080}:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${KIBAN_ZABBIX_DB_PASSWORD:-zabbix-password}
      PHP_TZ: UTC
      KIBAN_ZABBIX_PORT: ${KIBAN_ZABBIX_PORT:-8080}
      KIBAN_ZABBIX_DB_PASSWORD: ${KIBAN_ZABBIX_DB_PASSWORD:-zabbix-password}
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.4.14-ubuntu
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    ports:
      - "${KIBAN_ZABBIX_SERVER_PORT:-10051}:10051"
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${KIBAN_ZABBIX_DB_PASSWORD:-zabbix-password}
      KIBAN_ZABBIX_SERVER_PORT: ${KIBAN_ZABBIX_SERVER_PORT:-10051}
    volumes:
      - zabbix_alertscripts:/usr/lib/zabbix/alertscripts
      - zabbix_externalscripts:/usr/lib/zabbix/externalscripts
  zabbix-db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${KIBAN_ZABBIX_DB_PASSWORD:-zabbix-password}
    volumes:
      - zabbix_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  zabbix_alertscripts:
  zabbix_externalscripts:
  zabbix_db:
