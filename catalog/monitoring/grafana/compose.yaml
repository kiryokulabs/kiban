services:
  grafana:
    image: grafana/grafana-oss
    environment:
      SERVICE_URL_GRAFANA_3000: ${SERVICE_URL_GRAFANA_3000:-http://localhost}
      GF_SERVER_ROOT_URL: ${SERVICE_URL_GRAFANA}
      GF_SERVER_DOMAIN: ${SERVICE_FQDN_GRAFANA}
      GF_SECURITY_ADMIN_PASSWORD: ${SERVICE_PASSWORD_GRAFANA}
      GF_SECURITY_ADMIN_USER: ${SERVICE_USER_GRAFANA:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped
    ports:
      - "3000"
volumes:
  grafana-data: {}
