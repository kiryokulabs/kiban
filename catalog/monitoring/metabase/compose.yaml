services:
  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PORT: ${KIBAN_METABASE_PORT:-3000}
    ports:
      - "${KIBAN_METABASE_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
volumes:
  metabase_data:
