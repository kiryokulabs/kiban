services:
  activepieces:
    image: activepieces/activepieces:latest
    restart: unless-stopped
    environment:
      AP_QUEUE_MODE: MEMORY
      AP_DB_TYPE: SQLITE3
      AP_FRONTEND_URL: ${KIBAN_ACTIVEPIECES_FRONTEND_URL:-http://localhost}
    ports:
      - "${KIBAN_ACTIVEPIECES_PORT:-80}:80"
    volumes:
      - activepieces_data:/data
volumes:
  activepieces_data:
