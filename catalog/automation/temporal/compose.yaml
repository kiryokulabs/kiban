services:
  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: ${KIBAN_TEMPORAL_DB_USER:-postgres}
      POSTGRES_PWD: ${KIBAN_TEMPORAL_DB_PASSWORD:-temporal}
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_DB: ${KIBAN_TEMPORAL_DB:-temporal}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - temporal:7233
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    ports:
      - "7233"
  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "8080"
  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KIBAN_TEMPORAL_DB:-temporal}
      POSTGRES_USER: ${KIBAN_TEMPORAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${KIBAN_TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  temporal_db_data: {}
