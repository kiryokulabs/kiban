services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${KIBAN_MINIO_ROOT_USER:-kiban}
      MINIO_ROOT_PASSWORD: ${KIBAN_MINIO_ROOT_PASSWORD:-kiban12345}
    ports:
      - "${KIBAN_MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
volumes:
  minio_data:
