services:
  pgweb:
    image: sosedoff/pgweb:0.17.0
    restart: unless-stopped
    depends_on:
      pgweb-postgres:
        condition: service_healthy
    ports:
      - "${KIBAN_PGWEB_PORT:-8081}:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://pgweb:pgweb-password@pgweb-postgres:5432/pgweb?sslmode=disable
      KIBAN_PGWEB_PORT: ${KIBAN_PGWEB_PORT:-8081}
  pgweb-postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgweb
      POSTGRES_USER: pgweb
      POSTGRES_PASSWORD: pgweb-password
    volumes:
      - pgweb_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  pgweb_postgres:
