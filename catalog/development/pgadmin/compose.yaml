services:
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${KIBAN_PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${KIBAN_PGADMIN_PASSWORD:-kiban}
    ports:
      - "${KIBAN_PGADMIN_PORT:-80}:80"
    volumes:
      - pgadmin_data:/data
volumes:
  pgadmin_data:
