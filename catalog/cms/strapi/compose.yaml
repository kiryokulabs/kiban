services:
  strapi:
    image: vshadbolt/strapi:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapi-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${KIBAN_STRAPI_DB_NAME:-strapi}
      DATABASE_USERNAME: ${KIBAN_STRAPI_DB_USER:-strapi}
      DATABASE_PASSWORD: ${KIBAN_STRAPI_DB_PASSWORD:-strapi}
      JWT_SECRET: ${KIBAN_STRAPI_JWT_SECRET:-KibanStrapiJwtSecret2026}
      ADMIN_JWT_SECRET: ${KIBAN_STRAPI_ADMIN_JWT_SECRET:-KibanStrapiAdminJwtSecret2026}
      APP_KEYS: ${KIBAN_STRAPI_APP_KEYS:-key1AbCdEfGhIjKlMnOpQrStUvWxYz,key2AbCdEfGhIjKlMnOpQrStUvWxYz,key3AbCdEfGhIjKlMnOpQrStUvWxYz,key4AbCdEfGhIjKlMnOpQrStUvWxYz}
      API_TOKEN_SALT: ${KIBAN_STRAPI_API_TOKEN_SALT:-KibanStrapiApiTokenSalt2026}
      TRANSFER_TOKEN_SALT: ${KIBAN_STRAPI_TRANSFER_TOKEN_SALT:-KibanStrapiTransferTokenSalt2026}
      BUILD: "true"
      ADMIN_URL: ${SERVICE_URL_STRAPI}/admin
      PUBLIC_URL: ${SERVICE_URL_STRAPI}
      KIBAN_STRAPI_DB_NAME: ${KIBAN_STRAPI_DB_NAME:-strapi}
      KIBAN_STRAPI_DB_USER: ${KIBAN_STRAPI_DB_USER:-strapi}
      KIBAN_STRAPI_DB_PASSWORD: ${KIBAN_STRAPI_DB_PASSWORD:-strapi}
    ports:
      - "${KIBAN_STRAPI_PORT:-1337}:1337"
    depends_on:
      strapi-db:
        condition: service_healthy
  strapi-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KIBAN_STRAPI_DB_NAME:-strapi}
      POSTGRES_USER: ${KIBAN_STRAPI_DB_USER:-strapi}
      POSTGRES_PASSWORD: ${KIBAN_STRAPI_DB_PASSWORD:-strapi}
    volumes:
      - strapi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  strapi_db_data:
