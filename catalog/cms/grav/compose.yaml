services:
  grav:
    image: lscr.io/linuxserver/grav:2.2.4-ls284
    restart: unless-stopped
    ports:
      - "${KIBAN_GRAV_PORT:-80}:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      KIBAN_GRAV_PORT: ${KIBAN_GRAV_PORT:-80}
    volumes:
      - grav_config:/config
volumes:
  grav_config:
