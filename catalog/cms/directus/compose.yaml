services:
  directus:
    image: directus/directus:latest
    restart: unless-stopped
    ports:
      - "${KIBAN_DIRECTUS_PORT:-8055}:8055"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    depends_on:
      directus-db:
        condition: service_healthy
      directus-redis:
        condition: service_healthy
    environment:
      SECRET: ${KIBAN_DIRECTUS_SECRET:-change-me-to-a-random-string}
      DB_CLIENT: pg
      DB_HOST: directus-db
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus
      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: redis
      REDIS: redis://directus-redis:6379
      ADMIN_EMAIL: ${KIBAN_DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${KIBAN_DIRECTUS_ADMIN_PASSWORD:-d1r3ctu5}
      KIBAN_DIRECTUS_PORT: ${KIBAN_DIRECTUS_PORT:-8055}
      KIBAN_DIRECTUS_SECRET: ${KIBAN_DIRECTUS_SECRET:-change-me-to-a-random-string}
      KIBAN_DIRECTUS_ADMIN_EMAIL: ${KIBAN_DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      KIBAN_DIRECTUS_ADMIN_PASSWORD: ${KIBAN_DIRECTUS_ADMIN_PASSWORD:-d1r3ctu5}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8055/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  directus-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
    volumes:
      - directus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 5s
      timeout: 5s
      retries: 5
  directus-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - directus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  directus_uploads:
  directus_extensions:
  directus_db_data:
  directus_redis_data:
