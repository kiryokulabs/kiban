services:
  directus:
    image: directus/directus:11
    volumes:
      - directus-database:/directus/database
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
      - directus-templates:/directus/templates
    environment:
      SERVICE_URL_DIRECTUS_8055: ${SERVICE_URL_DIRECTUS_8055:-http://localhost}
      KEY: ${SERVICE_BASE64_64_KEY:-kiban-kiban-kiban-kiban-kiban-kiban-kiban-kiban}
      SECRET: ${SERVICE_BASE64_64_SECRET:-kiban-kiban-kiban-kiban-kiban-kiban-kiban-kiban}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN:-kiban}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_METHODS: ${CORS_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8055/admin/login
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped
    ports:
      - "8055"
volumes:
  directus-database: {}
  directus-extensions: {}
  directus-templates: {}
  directus-uploads: {}
