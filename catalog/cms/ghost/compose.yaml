services:
  ghost:
    image: ghost:latest
    restart: unless-stopped
    environment:
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__port: 3306
      database__connection__user: ${KIBAN_GHOST_DB_USER:-ghost}
      database__connection__password: ${KIBAN_GHOST_DB_PASSWORD:-ghost}
      database__connection__database: ${KIBAN_GHOST_DB_NAME:-ghost}
      url: http://localhost:${KIBAN_GHOST_PORT:-2368}
      KIBAN_GHOST_DB_NAME: ${KIBAN_GHOST_DB_NAME:-ghost}
      KIBAN_GHOST_DB_USER: ${KIBAN_GHOST_DB_USER:-ghost}
      KIBAN_GHOST_DB_PASSWORD: ${KIBAN_GHOST_DB_PASSWORD:-ghost}
      KIBAN_GHOST_DB_ROOT_PASSWORD: ${KIBAN_GHOST_DB_ROOT_PASSWORD:-root}
    ports:
      - "${KIBAN_GHOST_PORT:-2368}:2368"
    depends_on:
      ghost-db:
        condition: service_healthy
    volumes:
      - ghost_data:/var/lib/ghost/content
  ghost-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${KIBAN_GHOST_DB_NAME:-ghost}
      MYSQL_USER: ${KIBAN_GHOST_DB_USER:-ghost}
      MYSQL_PASSWORD: ${KIBAN_GHOST_DB_PASSWORD:-ghost}
      MYSQL_ROOT_PASSWORD: ${KIBAN_GHOST_DB_ROOT_PASSWORD:-root}
    volumes:
      - ghost_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  ghost_data:
  ghost_db_data:
