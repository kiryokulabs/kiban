# Preserve HTTPS information from Kiban's TLS reverse proxy; direct HTTP stays usable.
map $http_x_forwarded_proto $kiban_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://kiban-api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiban_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass http://kiban-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiban_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
