name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
      API_IMAGE: ghcr.io/kibanos/kiban-api
      WEB_IMAGE: ghcr.io/kibanos/kiban-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image version
        id: version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Prepare release assets
        run: |
          mkdir -p dist/release
          printf '%s\n' "${{ steps.version.outputs.version }}" > dist/release/VERSION
          cp installer/templates/compose.yaml dist/release/compose.yaml
          cp apps/cli/kiban dist/release/kiban
          chmod +x dist/release/kiban

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiban-release-assets-${{ steps.version.outputs.version }}
          path: dist/release/*

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/VERSION
            dist/release/compose.yaml
            dist/release/kiban
